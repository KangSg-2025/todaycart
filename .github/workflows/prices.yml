# 참고 가격 자동 갱신 (한국소비자원 참가격 → prices/latest.json)
# - 월 · 수 · 토 낮 12시(한국 시간)에 확인. 새 조사(2주마다 금요일)가 올라왔을 때만 파일을 바꿈
# - 인증키: 저장소 Settings › Secrets and variables › Actions › DATA_GO_KR_KEY
# - 직접 돌리기: Actions 탭 › 참고 가격 갱신 › Run workflow
name: 참고 가격 갱신

on:
  schedule:
    - cron: '0 3 * * 1,3,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: 가격 받기 · 요약
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: dart run tools/fetch_prices.dart prices
      - name: 바뀌었으면 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices
          git diff --cached --quiet || (git commit -m "참고 가격 갱신" && git push)
